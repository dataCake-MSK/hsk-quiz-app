name: 버그
description: 동작 오류 보고
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 현상
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "기기 / OS 버전 / 앱 버전 또는 커밋"
