name: CI backend

# 포크 PR도 검사하되 pull_request 트리거만 쓴다.
# (pull_request_target은 포크 코드에 시크릿을 노출할 수 있어 쓰지 않는다 — 보안 리포트 2절 P4)
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

# 이 워크플로는 저장소에 아무것도 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: ruff · pytest · alembic
    runs-on: ubuntu-latest

    # DB 테스트와 마이그레이션 검증용. 개발 PC와 같은 메이저 버전(17)을 쓴다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hsk_quiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI 전용 로컬 컨테이너 접속 정보(비밀 값 아님). 실제 환경 값은 .env에만 둔다.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/hsk_quiz_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/hsk_quiz_test

    steps:
      - uses: actions/checkout@v7

      # setup-uv는 v10 같은 이동 태그를 제공하지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 의존성 설치 (lock 그대로)
        run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: 포맷 확인
        run: uv run ruff format --check .

      - name: 마이그레이션 적용
        run: uv run alembic upgrade head

      - name: 마이그레이션 되돌리기 확인
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: 테스트
        run: uv run pytest -q
