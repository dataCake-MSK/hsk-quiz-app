name: CI mobile

# 포크 PR도 검사하되 pull_request 트리거만 쓴다(보안 리포트 2절 P4).
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: tsc · eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 의존성 설치 (lock 그대로)
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: lint
        run: npx expo lint
        env:
          CI: '1'
